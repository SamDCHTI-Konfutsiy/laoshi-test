<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老师 Test — Laoshi nazorat platformasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F5F1; --card:#FFFFFF; --ink:#212A33; --ink-soft:#5A6672;
  --line:#E3E1DA; --red:#BE3A2B; --red-soft:#F7E8E5; --jade:#2F7D5B; --jade-soft:#E6F2EC;
  --amber:#D08B0B; --amber-soft:#FBF1DC; --blue:#3D6B8E; --blue-soft:#E7EFF5;
  --r:12px; --shadow:0 2px 10px rgba(33,42,51,.07);
  --serif:'Noto Serif SC',serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 80px}
.narrow{max-width:640px}
h1,h2,h3{font-family:var(--serif)}
h1{font-size:26px} h2{font-size:20px;margin-bottom:12px} h3{font-size:16px}
.muted{color:var(--ink-soft);font-size:13.5px}
.hidden{display:none!important}

/* seal logo */
.seal{width:44px;height:44px;background:var(--red);color:#fff;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-weight:900;font-size:24px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);flex:none}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.brand small{display:block;color:var(--ink-soft);font-size:12.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px;margin-bottom:16px}

button{font-family:var(--sans);font-size:14.5px;font-weight:600;border:none;border-radius:9px;
  padding:10px 18px;cursor:pointer;transition:.15s}
.btn-p{background:var(--ink);color:#fff}.btn-p:hover{background:#37424e}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#a32e21}
.btn-jade{background:var(--jade);color:#fff}.btn-jade:hover{background:#256648}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:7px}
button:disabled{opacity:.45;cursor:not-allowed}

input,textarea,select{width:100%;font-family:var(--sans);font-size:14.5px;color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;line-height:1.6}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-soft)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* traffic lights */
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:-1px}
.d-green{background:var(--jade)} .d-yellow{background:var(--amber)}
.d-red{background:var(--red)} .d-blue{background:var(--blue)} .d-gray{background:#B9BFC6}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;
  font-size:12px;font-weight:600}
.p-green{background:var(--jade-soft);color:var(--jade)}
.p-yellow{background:var(--amber-soft);color:#96650a}
.p-red{background:var(--red-soft);color:var(--red)}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-gray{background:#EEF0F2;color:var(--ink-soft)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
  text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#FAFAF7}
.bar{height:8px;background:#EEF0F2;border-radius:99px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--red);border-radius:99px}

/* student test */
.q-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-bottom:14px}
.q-num{font-family:var(--serif);font-weight:900;color:var(--red);font-size:15px;margin-right:6px}
.q-text{font-weight:600;font-size:15.5px;margin-bottom:12px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--ink-soft)}
.opt.sel{border-color:var(--ink);background:#F4F6F8;box-shadow:inset 3px 0 0 var(--ink)}
.opt input{width:auto;margin-top:3px}
.timerbar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;border-radius:10px;
  padding:12px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.timerbar b{font-family:var(--serif);font-size:20px;letter-spacing:.05em}
.timerbar.warn b{color:#FFC96B}.timerbar.crit b{color:#FF8A7A}
.noselect{user-select:none;-webkit-user-select:none}

/* result stamp */
.stamp{width:120px;height:120px;border:5px solid var(--red);border-radius:14px;color:var(--red);
  display:flex;flex-direction:column;align-items:center;justify-content:center;margin:18px auto;
  font-family:var(--serif);transform:rotate(-6deg);opacity:.92}
.stamp b{font-size:40px;font-weight:900;line-height:1}
.stamp span{font-size:12px;font-weight:700;letter-spacing:.1em}
.stamp.pass{border-color:var(--jade);color:var(--jade)}

.center{text-align:center}
.big-time{font-family:var(--serif);font-size:42px;font-weight:900}
.code{font-family:ui-monospace,monospace;background:#F0F1EC;border:1px solid var(--line);
  border-radius:7px;padding:2px 7px;font-size:13px}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{font-family:ui-monospace,monospace;font-size:12.5px}
.note{background:var(--amber-soft);border:1px solid #EBD9AE;border-radius:10px;
  padding:12px 14px;font-size:13.5px;margin:12px 0}
.note.red{background:var(--red-soft);border-color:#E8C4BE}
.note.green{background:var(--jade-soft);border-color:#BFE0CF}
.modal-bg{position:fixed;inset:0;background:rgba(33,42,51,.5);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:680px;width:100%;max-height:85vh;
  overflow-y:auto;padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.wrap{padding:16px 10px 60px}}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:center}
.stat b{font-family:var(--serif);font-size:26px;display:block}
.stat span{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
footer{margin-top:40px;text-align:center;color:var(--ink-soft);font-size:12.5px}

/* ============================================================
   UI 2.0 — qatorlar, menyular, yopishqoq sarlavha, mobil tartib
   (Yuqoridagi uslublar saqlanadi; bu qatlam ularni yaxshilaydi)
   ============================================================ */
:root{
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(33,42,51,.04), 0 4px 14px rgba(33,42,51,.06);
  --shadow-pop:0 8px 28px rgba(33,42,51,.16);
  --focus:0 0 0 3px rgba(61,107,142,.25);
}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1140px}

/* --- yopishqoq sarlavha --- */
.brand.topbar{
  position:sticky;top:0;z-index:60;margin:-24px -16px 20px;padding:14px 16px;
  background:rgba(246,245,241,.88);backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line);gap:14px
}
.brand.topbar h1{font-size:20px;line-height:1.25}
.brand.topbar .seal{width:38px;height:38px;font-size:21px}

/* --- tablar: mobilda gorizontal siljiydi --- */
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;
  -webkit-overflow-scrolling:touch;margin-bottom:20px}
.tabs::-webkit-scrollbar{display:none}
.tabs-wrap{position:relative}
.tabs-wrap::after{content:'';position:absolute;right:0;top:0;bottom:6px;width:36px;pointer-events:none;
  background:linear-gradient(90deg,rgba(246,245,241,0),var(--paper))}
.tab{white-space:nowrap;flex:none;transition:background .15s,color .15s,border-color .15s}
.tab:hover:not(.on){border-color:var(--ink-soft);color:var(--ink)}
.tab-sep{flex:none;width:1px;align-self:stretch;background:var(--line);margin:4px 6px}

/* --- kartochka --- */
.card{padding:20px 22px;border-radius:var(--r-lg)}
.card h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card+.card{margin-top:0}
@media(max-width:640px){ .card{padding:16px 14px;border-radius:var(--r)} }

/* --- ro'yxat qatori: sarlavha + izoh + amallar --- */
.lrow{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s
}
.lrow:hover{border-color:#D3D0C7;box-shadow:var(--shadow)}
.lrow-main{min-width:220px;flex:1}
.lrow-title{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.35;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lrow-sub{color:var(--ink-soft);font-size:13.5px;margin-top:3px}
.lrow-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}
@media(max-width:640px){
  .lrow{padding:13px 13px}
  .lrow-act{width:100%}
  .lrow-act .btn-sm{flex:1;min-width:auto}
  .lrow-act .menu{flex:none}
}

/* --- "⋯" menyu --- */
.menu{position:relative;display:inline-block}
.menu-btn{min-width:38px;font-size:17px;line-height:1;padding:6px 10px;letter-spacing:1px}
.menu-pop{
  position:absolute;right:0;top:calc(100% + 6px);z-index:70;min-width:214px;
  background:#fff;border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-pop);padding:6px;display:flex;flex-direction:column
}
.menu-item{
  background:transparent;border:none;text-align:left;padding:9px 11px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:500;color:var(--ink);width:100%;white-space:nowrap
}
.menu-item:hover{background:#F2F4F6}
.menu-item.danger{color:var(--red)}
.menu-item.danger:hover{background:var(--red-soft)}
@media(max-width:640px){ .menu-pop{right:auto;left:0} }

/* --- tugmalar --- */
button{transition:background .15s,border-color .15s,color .15s,transform .06s}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:none;box-shadow:var(--focus)}
.btn-ghost{background:#fff}
.btn-ghost:hover{border-color:var(--ink-soft);background:#FBFBF9}

/* --- maydonlar --- */
input,textarea,select{transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{box-shadow:var(--focus)}
input[type=file]{padding:9px 11px;background:#FBFBF9;font-size:13.5px}
input[type=radio],input[type=checkbox]{box-shadow:none}
label{margin-top:16px}
.card>label:first-child{margin-top:0}

/* --- jadval --- */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.tbl table{font-size:13.5px}
.tbl th{position:sticky;top:0;background:#FBFBF9;z-index:1}
.tbl tr:last-child td{border-bottom:none}
td,th{padding:11px 12px}
tr:hover td{background:#FAFAF7}

/* --- bo'sh holat --- */
.empty{text-align:center;padding:34px 18px;color:var(--ink-soft)}
.empty .ico{font-size:34px;display:block;margin-bottom:8px;opacity:.75}

/* --- statistika --- */
.stat{border-radius:var(--r);padding:16px 14px}
.stat b{font-size:28px}

/* --- pill va kod --- */
.pill{padding:3px 9px;font-size:11.5px;letter-spacing:.01em}
.code{font-size:12.5px}

/* --- eslatma --- */
.note{border-radius:var(--r);line-height:1.5}

/* --- modal --- */
.modal{border-radius:var(--r-lg);box-shadow:var(--shadow-pop)}
@media(max-width:640px){ .modal{padding:18px 16px;max-height:92vh} }

/* --- havola qatori --- */
.linkbox{flex-wrap:wrap}
.linkbox input{min-width:180px;flex:1}

/* --- mobil sarlavha --- */
@media(max-width:640px){
  .brand.topbar{flex-wrap:wrap;gap:10px;padding:12px 12px;margin:-16px -10px 16px}
  .brand.topbar h1{font-size:17px}
  .brand.topbar small{font-size:11.5px;line-height:1.35}
  .brand.topbar .seal{width:34px;height:34px;font-size:19px}
  .brand.topbar>div:last-child{width:100%;justify-content:stretch;gap:8px}
  .brand.topbar>div:last-child .btn-sm{flex:1;font-size:12.5px;padding:8px 6px}
  .tabs-wrap::after{width:24px}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
/* ============================================================
   ⚙️ SOZLAMALAR endi shu faylda emas — "config.js" faylida.
   Bu yerga hech narsa yozmang; config.js ni tahrirlang.
   (config.js topilmasa yoki bo'sh bo'lsa, quyida standart bo'sh qiymatlar ishlatiladi
   va sayt "Firebase hali ulanmagan" ekranini ko'rsatadi.)
   ============================================================ */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || {};
// Google Apps Script backend manzili — faqat "111111ga majburiy tiklash" tugmasi uchun kerak.
// Bo'sh qoldirilsa, tugma buni tushuntirib xato ko'rsatadi (sayt boshqa hamma joyda odatdagidek ishlayveradi).
const APPS_SCRIPT_URL = window.APPS_SCRIPT_URL || '';

const p2_ = n => String(n).padStart(2,'0');
/* Sana formati qo'lda: brauzer "uz-UZ" uchun "2026 M08 24" kabi g'alati ko'rinish beradi. */
function fmtD(ms){ if(!ms) return '—'; const d = new Date(ms); return `${p2_(d.getDate())}.${p2_(d.getMonth()+1)}.${d.getFullYear()}`; }
function fmtHM(ms){ if(!ms) return '—'; const d = new Date(ms); return `${p2_(d.getHours())}:${p2_(d.getMinutes())}`; }
function fmtDT(ms){ if(!ms) return '—'; return fmtD(ms) + ' · ' + fmtHM(ms); }
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fbReady = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL;
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
let db = null, auth = null, currentUser = null, currentProfile = null, testsListenerRef = null, authMode = 'login', authBusy = false;
if (fbReady){ firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); auth = firebase.auth(); }
// Admin yangi laoshi hisobi yaratganda o'z sessiyasidan chiqib ketmasligi uchun ikkinchi, mustaqil Firebase App:
function getSecondaryAuth(){
  let sApp = firebase.apps.find(a=>a.name==='secondary');
  if(!sApp) sApp = firebase.initializeApp(FIREBASE_CONFIG, 'secondary');
  return sApp.auth();
}


const uid = n => Array.from({length:n},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');
const fmtT = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };

/* ---------- TEST PARSER ----------
   Format:
   1. Savol matni?
   Variant A
   # To'g'ri variant
   Variant C
   ----
*/
function parseTest(text){
  const blocks = text.split(/\n\s*-{3,}\s*\n?/).map(b=>b.trim()).filter(Boolean);
  const questions = []; const errors = [];
  blocks.forEach((b,i)=>{
    const lines = b.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length < 3){ errors.push(`${i+1}-blok: kamida 1 savol + 2 variant kerak`); return; }
    const q = lines[0].replace(/^\d+[\.\)]\s*/,'');
    const options = []; let correct = -1;
    lines.slice(1).forEach(l=>{
      let raw = l, isCorrect = false;
      if(raw.startsWith('#')){ isCorrect = true; raw = raw.replace(/^#\s*/,''); }
      raw = raw.replace(/^[A-Za-zА-Яа-я][\.\):]\s+/,''); // ixtiyoriy "A. " kabi harf-belgini olib tashlaydi
      if(isCorrect) correct = options.length;
      options.push(raw);
    });
    if(correct === -1){ errors.push(`${i+1}-savol: to'g'ri javob (#) belgilanmagan`); return; }
    questions.push({q, options, correct});
  });
  return {questions, errors};
}

function parseCriteria(text){
  const rows = [];
  text.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m = l.match(/^(\d+)\s*=\s*(.+)$/);
    if(m) rows.push({min:+m[1], label:m[2].trim()});
  });
  rows.sort((a,b)=>b.min-a.min);
  return rows;
}
function gradeOf(percent, criteria){
  for(const c of criteria) if(percent >= c.min) return c.label;
  return criteria.length ? criteria[criteria.length-1].label : '—';
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ================= ROUTING ================= */
const params = new URLSearchParams(location.search);
function loadingScreen(){ app.innerHTML = `<div class="narrow center" style="margin:60px auto"><p class="muted">Yuklanmoqda…</p></div>`; }
function adminRoute(){
  const u = auth.currentUser;
  if(u){
    currentUser = u;
    db.ref('teachers/'+u.uid).once('value').then(snap=>{
      currentProfile = snap.val();
      if(!currentProfile){ auth.signOut().then(()=>{ authMode='login'; renderAuthGate(); }); return; }
      if(currentProfile.active === false){
        auth.signOut().then(renderRestricted);
        return;
      }
      renderAdmin();
    }).catch(e=> renderRouteError(e));
  } else {
    // "teachers" tizimga kirmasdan o'qib bo'lmaydi (maxfiylik uchun), shu sabab bootstrap holatini
    // alohida ochiq bayroq (system/bootstrapped) orqali tekshiramiz.
    db.ref('system/bootstrapped').once('value').then(snap=>{
      if(!snap.val()) renderBootstrap();
      else { authMode='login'; renderAuthGate(); }
    }).catch(e=> renderRouteError(e));
  }
}
function renderRestricted(){
  app.innerHTML = `
  <div class="narrow" style="margin:0 auto">
    <div class="card center" style="margin-top:40px">
      <div style="font-size:44px">🚫</div>
      <h2>Hisobingiz cheklangan</h2>
      <p class="muted">Administrator hisobingizga vaqtincha kirishni cheklagan. Savollar bo'lsa,
      administrator bilan bog'laning.</p>
    </div>
  </div>`;
}
function renderRouteError(e){
  console.error(e);
  app.innerHTML = `
  <div class="narrow" style="margin:0 auto">
    <div class="card center" style="margin-top:40px">
      <div style="font-size:44px">⚠️</div>
      <h2>Xatolik yuz berdi</h2>
      <p class="muted">${esc((e && e.message) || String(e))}</p>
      <p class="muted" style="margin-top:8px">Bu odatda Firebase Database Rules hali yangilanmaganini
      bildiradi. Rules bo'limini tekshiring, keyin qayta urinib ko'ring.</p>
      <button class="btn-ghost" style="margin-top:12px" onclick="location.reload()">Qayta yuklash</button>
    </div>
  </div>`;
}
window.addEventListener('load', ()=>{
  if(!fbReady) return renderSetup();
  if(params.get('t')) return studentEntry(params.get('t'));
  if(location.hash === '#admin'){ loadingScreen(); return; }
  renderLanding();
});
window.addEventListener('hashchange', ()=>{
  if(!fbReady || params.get('t')) return;
  if(location.hash === '#admin'){ loadingScreen(); adminRoute(); }
  else renderLanding();
});
if (fbReady){
  auth.onAuthStateChanged(u=>{
    currentUser = u;

function doBootstrap(){
  const name = $('#a-name').value.trim();
  const email = $('#a-email').value.trim();
  const pass = $('#a-pass').value;
  if(name.length < 2) return authMsg("Ismingizni kiriting");
  if(!email) return authMsg("Email kiriting");
  if(pass.length < 6) return authMsg("Parol kamida 6 belgi bo'lsin");
  authMsg('');
  authBusy = true;
  auth.createUserWithEmailAndPassword(email, pass).then(cred=>{
    return cred.user.updateProfile({displayName:name}).then(()=>{
      const updates = {};
      updates['teachers/'+cred.user.uid] = {name, email, role:'admin', active:true, createdAt:Date.now()};
      updates['system/bootstrapped'] = true;
      return db.ref().update(updates);
    });
  }).then(()=>{
    authBusy = false; currentUser = auth.currentUser; adminRoute();
  }).catch(e=>{ authBusy = false; authMsg(friendlyAuthError(e.code)); });

function renderAuthGate(){
  app.innerHTML = `

        <button class="btn-p" onclick="doLogin()">Kirish</button>

function authMsg(msg, type){
  $('#a-err').innerHTML = msg ? `<div class="note ${type||'red'}">${esc(msg)}</div>` : '';
}
function friendlyAuthError(code){
  const map = {
    'auth/email-already-in-use': "Bu email allaqachon ro'yxatdan o'tgan.",
    'auth/invalid-email': "Email noto'g'ri formatda.",
    'auth/weak-password': "Parol juda oddiy, kamida 6 belgi bo'lsin.",
    'auth/user-not-found': "Bunday email topilmadi.",
    'auth/wrong-password': "Parol noto'g'ri.",
    'auth/invalid-credential': "Email yoki parol noto'g'ri.",
    'auth/too-many-requests': "Juda ko'p urinish bo'ldi. Birozdan keyin qayta urinib ko'ring."
  };
  return map[code] || ("Xatolik: " + code);
}
function doLogin(){
  const email = $('#a-email').value.trim();
  const pass = $('#a-pass').value;
  if(!email || !pass) return authMsg("Email va parolni kiriting");
  authMsg('');
  // Muvaffaqiyatli kirishdan keyin panelga o'tishni onAuthStateChanged'ga qoldirmaymiz:
  // u faqat location.hash === '#admin' bo'lgandagina ishlaydi, aks holda ekran jim qoladi.
  authBusy = true;
  auth.signInWithEmailAndPassword(email, pass)
    .then(()=>{
      authBusy = false;
      currentUser = auth.currentUser;
      if(location.hash === '#admin') adminRoute();
      else location.hash = '#admin';   // hashchange -> loadingScreen + adminRoute
    })
    .catch(e=>{ authBusy = false; authMsg(friendlyAuthError(e.code)); });
}
function doReset(){
  const email = $('#a-email').value.trim();
  if(!email) return authMsg("Avval email kiriting, keyin qayta bosing");
  auth.sendPasswordResetEmail(email)
    .then(()=>authMsg("✅ Parolni tiklash havolasi emailingizga yuborildi", 'green'))
    .catch(e=>authMsg(friendlyAuthError(e.code)));
}
function doLogout(){
  if(testsListenerRef){ testsListenerRef.off(); testsListenerRef=null; }
  if(sharedTestsListenerRef){ sharedTestsListenerRef.off(); sharedTestsListenerRef=null; }
  if(allTestsListenerRef){ allTestsListenerRef.off(); allTestsListenerRef=null; }
  if(announceListenerRef){ announceListenerRef.off(); announceListenerRef=null; }
  if(sessListener) sessListener.off();
  tests = {}; sharedTests = {}; allTests = {}; curTestId = null; currentProfile = null;
  logEvent('auth.logout').then(()=>{
    window.__sessionLogged = false;
    return auth.signOut();
  }).then(()=>{ location.hash=''; renderLanding(); });
}

function openChangePasswordModal(){
  document.body.insertAdjacentHTML('beforeend', `
  <div class="modal-bg" onclick="if(event.target===this)this.remove()">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 style="margin:0">🔑 Parolni almashtirish</h2>
        <button class="btn-ghost btn-sm" onclick="document.querySelector('.modal-bg').remove()">✕</button>
      </div>
      <label>Joriy parol</label>
      <input id="cp-old" type="password" autocomplete="current-password" placeholder="hozirgi parolingiz">
      <label>Yangi parol</label>
      <input id="cp-new" type="password" autocomplete="new-password" placeholder="kamida 6 belgi">
      <label>Yangi parolni tasdiqlang</label>
      <input id="cp-new2" type="password" autocomplete="new-password" placeholder="yana bir marta" onkeydown="if(event.key==='Enter')doChangePassword()">
      <div id="cp-err"></div>
      <div style="margin-top:14px"><button class="btn-p" onclick="doChangePassword()">Saqlash</button></div>
    </div>
  </div>`);
  $('#cp-old').focus();
}
function doChangePassword(){
  const oldPass = $('#cp-old').value;
  const newPass = $('#cp-new').value;
  const newPass2 = $('#cp-new2').value;
  const err = m => { $('#cp-err').innerHTML = m ? `<div class="note red">${esc(m)}</div>` : ''; };
  if(!oldPass) return err("Joriy parolingizni kiriting");
  if(newPass.length < 6) return err("Yangi parol kamida 6 belgi bo'lsin");
  if(newPass !== newPass2) return err("Yangi parollar bir xil emas");
  err('');
  const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, oldPass);
  currentUser.reauthenticateWithCredential(cred)
    .then(()=> currentUser.updatePassword(newPass))
    .then(()=>{
      document.querySelector('.modal-bg').remove();
      logEvent('auth.password');
      alert("✅ Parolingiz muvaffaqiyatli almashtirildi.");
    })
    .catch(e=> err(friendlyAuthError(e.code)));
}

function genPass(){

function ntMsg(msg, type){

function adminCreateTeacher(){
  const name = $('#nt-name').value.trim();
  const email = $('#nt-email').value.trim();
  const pass = $('#nt-pass').value;
  const role = $('#nt-role').value === 'admin' ? 'admin' : 'teacher';
  if(name.length < 2) return ntMsg("Ism kiriting");
  if(!email) return ntMsg("Email kiriting");
  if(pass.length < 6) return ntMsg("Parol kamida 6 belgi bo'lsin");
  ntMsg('');
  const sAuth = getSecondaryAuth();
  sAuth.createUserWithEmailAndPassword(email, pass).then(cred=>{
    const newUid = cred.user.uid;
    return db.ref('teachers/'+newUid).set({
      name, email, role, active:true, createdAt:Date.now(), createdBy: currentUser.uid
    }).then(()=> sAuth.signOut());
  }).then(()=>{
    logEvent('teacher.create', { targetName:name, note:`${email} · rol: ${role==='admin'?'administrator':'laoshi'}` });
    ntMsg(`✅ Hisob yaratildi (${role==='admin'?'Administrator':'Laoshi'}). Email: ${email} · Parol: ${pass}`, 'green');
    $('#nt-name').value=''; $('#nt-email').value=''; $('#nt-pass').value = genPass(); $('#nt-role').value='teacher';
    loadTeachersList();
  }).catch(e=> ntMsg(friendlyAuthError(e.code)));
}
function loadTeachersList(){
  Promise.all([ db.ref('teachers').once('value'), db.ref('tests').once('value') ]).then(([tSnap, testSnap])=>{
    const teachers = tSnap.val()||{};
    const testsSnapVal = testSnap.val()||{};
    const byOwner = {};
    Object.entries(testsSnapVal).forEach(([tid,t])=>{ (byOwner[t.ownerUid] = byOwner[t.ownerUid]||[]).push({id:tid, ...t}); });
    window.__teachersCache = teachers;
    window.__teacherTestsCache = byOwner;
    const rows = Object.entries(teachers).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
    $('#t-list').innerHTML = !rows.length ? `<div class="empty"><span class="ico">👥</span>Hozircha hech kim yo'q.</div>` :
      rows.map(([tuid,t])=>{
        const count = (byOwner[tuid]||[]).length;
        const isSelf = tuid === currentUser.uid;
        return `<div class="lrow">
          <div class="lrow-main">
            <div class="lrow-title">${esc(t.name)}
              ${t.role==='admin' ? '<span class="pill p-blue">Administrator</span>' : ''}
              ${t.active===false ? '<span class="pill p-red">Cheklangan</span>' : '<span class="pill p-green">Faol</span>'}
              ${isSelf ? '<span class="pill p-gray">Siz</span>' : ''}
            </div>
            <div class="lrow-sub">${esc(t.email)} · ${count} ta test</div>
          </div>
          <div class="lrow-act">
            ${count>0 ? `<button class="btn-ghost btn-sm" onclick="toggleTeacherTests('${tuid}')">📚 Testlari</button>` : ''}
            ${(t.role!=='admin') ? `<button class="btn-ghost btn-sm" onclick="toggleTeacherActive('${tuid}', ${t.active===false})">${t.active===false?'✅ Ruxsat berish':'⛔️ Cheklash'}</button>` : ''}
            ${menuHtml('tm-'+tuid, [
              !isSelf && {label:'📧 Reset havola yuborish', fn:`adminResetTeacherPass('${tuid}')`},
              !isSelf && {label:'🔁 Parolni 111111 ga tiklash', fn:`adminForcePasswordReset('${tuid}')`},
              (t.role!=='admin') && {label:'⬆️ Administrator qilish', fn:`promoteToAdmin('${tuid}')`},
              (t.role==='admin' && !isSelf) && {label:'⬇️ Laoshi qilish', fn:`demoteToTeacher('${tuid}')`},
              (!isSelf && t.role!=='admin') && {label:'🗑 Hisobni o‘chirish', fn:`adminDeleteTeacher('${tuid}')`, danger:true}
            ])}
          </div>
          <div id="tt-${tuid}" class="hidden" style="width:100%;margin-top:12px"></div>
        </div>`;
      }).join('');
  });
}
function promoteToAdmin(tuid){
  const t = (window.__teachersCache||{})[tuid]; if(!t) return;
  if(!confirm(`${t.name} administrator qilinsinmi? U boshqa laoshilarni boshqara oladigan, hisob ochib/cheklay oladigan bo'ladi.`)) return;
  db.ref('teachers/'+tuid+'/role').set('admin')
    .then(()=> logEvent('teacher.promote', { targetId:tuid, targetName:t.name, note:t.email }))
    .then(loadTeachersList);
}
function demoteToTeacher(tuid){
  const t = (window.__teachersCache||{})[tuid]; if(!t) return;
  if(!confirm(`${t.name} oddiy laoshi qilinsinmi? U boshqa laoshilarni boshqara olmay qoladi.`)) return;
  db.ref('teachers/'+tuid+'/role').set('teacher')
    .then(()=> logEvent('teacher.demote', { targetId:tuid, targetName:t.name, note:t.email }))
    .then(loadTeachersList);
}
function toggleTeacherTests(tuid){
  const el = document.getElementById('tt-'+tuid); if(!el) return;

   Firebase Auth qoidasi bo'yicha admin boshqa birovning parolini to'g'ridan-to'g'ri o'zgartira olmaydi —

/* ---------- CSV o'qish ---------- */
function detectDelim(line){
  const c = (line.match(/,/g)||[]).length, s = (line.match(/;/g)||[]).length;
  return s > c ? ';' : ',';
}
function parseCSV(text, delim){
  const rows = []; let row = [], cur = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    }
    else if(ch === '"') inQ = true;
    else if(ch === delim){ row.push(cur); cur = ''; }
    else if(ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if(ch !== '\r') cur += ch;
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=> r.some(c=> String(c).trim() !== ''));
}
/* CSV qatori: Savol, A, B, C, D, ..., To'g'ri(harf yoki raqam) */
function csvToText(text){
  const first = text.split('\n')[0] || '';
  let rows = parseCSV(text, detectDelim(first));
  if(!rows.length) return { text:'', errors:['Fayl bo‘sh ko‘rinadi.'] };
  const h0 = String(rows[0][0]||'').trim().toLowerCase();
  if(h0 === 'savol' || h0 === 'savollar' || h0 === 'question') rows = rows.slice(1);
  const blocks = [], errors = [];
  rows.forEach((r, i)=>{
    const cells = r.map(c=> String(c).trim());
    const q = cells[0];
    const answer = cells[cells.length-1];
    const options = cells.slice(1, cells.length-1).filter(c=> c !== '');
    if(!q){ errors.push(`${i+1}-qator: savol matni bo‘sh`); return; }
    if(options.length < 2){ errors.push(`${i+1}-qator: kamida 2 ta variant kerak`); return; }
    let ci = -1;
    if(/^[A-Za-z]$/.test(answer)) ci = answer.toUpperCase().charCodeAt(0) - 65;
    else if(/^\d+$/.test(answer)) ci = (+answer) - 1;
    if(ci < 0 || ci >= options.length){
      errors.push(`${i+1}-qator: to‘g‘ri javob "${answer}" tushunarsiz (A, B, C… yoki 1, 2, 3… bo‘lsin)`);
      return;
    }
    blocks.push([q].concat(options.map((o,j)=> (j===ci?'#':'') + (LETTERS[j]||'') + '. ' + o)).join('\n'));
  });
  return { text: blocks.join('\n---\n'), errors, count: blocks.length };
}

function fileInfo(msg, type){
  const el = $('#c-fileinfo'); if(el) el.innerHTML = msg ? `<div class="note ${type||'red'}">${msg}</div>` : '';
}
function loadTestFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const raw = String(reader.result || '').replace(/^﻿/, '');
    const isCsv = /\.csv$/i.test(f.name) || (raw.split('\n')[0]||'').split(/[,;]/).length >= 3 && !/\n\s*-{3,}/.test(raw);
    let body, note;
    if(isCsv){
      const res = csvToText(raw);
      if(res.errors && res.errors.length){
        fileInfo('<b>Faylda xatolar bor:</b><br>' + res.errors.map(esc).join('<br>') +
                 (res.text ? '<br><br>Xatosiz qatorlar baribir qo‘shildi.' : ''), 'red');
      }
      if(!res.text){ input.value=''; return; }
      body = res.text; note = `${res.count} ta savol CSV fayldan o‘qildi`;
    } else {
      const chk = parseTest(raw);
      if(!chk.questions.length){
        fileInfo('Faylda savol topilmadi. Format namunasini yuklab olib solishtiring.', 'red');
        input.value=''; return;
      }
      if(chk.errors.length) fileInfo('<b>Ogohlantirish:</b><br>' + chk.errors.map(esc).join('<br>'), 'red');
      body = raw.trim(); note = `${chk.questions.length} ta savol matnli fayldan o‘qildi`;
    }
    appendToBody(body);
    const el = $('#c-fileinfo');
    if(el) el.innerHTML = (el.innerHTML||'') + `<div class="note green">✅ ${esc(note)} va pastdagi savollar maydoniga qo‘shildi. Tekshirib, kerak bo‘lsa qo‘lda tuzating.</div>`;
    previewTest();
    input.value = '';
  };
  reader.onerror = ()=> fileInfo('Faylni o‘qib bo‘lmadi.', 'red');
  reader.readAsText(f, 'utf-8');
}

function builderOptionRows(n){

       <label style="width:26px;margin:0;font-weight:700">${LETTERS[j]}.</label>

       <label style="display:flex;align-items:center;gap:4px;margin:0;white-space:nowrap;font-weight:400">
         <input type="radio" name="b-correct" value="${j}" style="width:auto;margin:0"> to'g'ri
       </label>
     </div>`).join('');
}
function builderAdd(){
  const q = $('#b-q').value.trim();
  const opts = [];
  for(let j=0;j<6;j++){ const v = $('#b-o'+j).value.trim(); if(v) opts.push({j, v}); }
  const picked = document.querySelector('input[name="b-correct"]:checked');
  const errEl = $('#b-err');
  const err = m => { errEl.innerHTML = m ? `<div class="note red">${esc(m)}</div>` : ''; };
  if(!q) return err('Savol matnini kiriting');
  if(opts.length < 2) return err('Kamida 2 ta variant kerak');
  if(!picked) return err("To'g'ri javobni belgilang");
  const ci = opts.findIndex(o=> o.j === +picked.value);
  if(ci === -1) return err("To'g'ri deb belgilangan variant bo'sh — matnini yozing yoki boshqasini tanlang");
  err('');
  appendToBody([q].concat(opts.map((o,k)=> (k===ci?'#':'') + LETTERS[k] + '. ' + o.v)).join('\n'));
  $('#b-q').value = '';
  for(let j=0;j<6;j++) $('#b-o'+j).value = '';
  if(picked) picked.checked = false;
  const n = parseTest($('#c-body').value).questions.length;
  errEl.innerHTML = `<div class="note green">✅ Qo'shildi. Hozir jami ${n} ta savol.</div>`;
  previewTest();
  $('#b-q').focus();
}

function saveTest(){
  const editing = editingTestId;
  const src = editing ? (window.__editSrc || {}) : null;
  const title = $('#c-title').value.trim();
  const {questions, errors} = parseTest($('#c-body').value);
  const criteria = parseCriteria($('#c-crit').value);
  if(!title) return alert('Test nomini kiriting');
  if(errors.length) return alert('Avval xatolarni tuzating:\n'+errors.join('\n'));
  if(!questions.length) return alert('Savollar topilmadi');
  if(!criteria.length) return alert('Baho mezonini kiriting');
  const startAt = $('#c-start').value ? new Date($('#c-start').value).getTime() : null;
  const endAt = $('#c-end').value ? new Date($('#c-end').value).getTime() : null;
  if(startAt && endAt && endAt <= startAt) return alert("Tugash vaqti boshlanish vaqtidan keyin bo'lishi kerak");
  const id = editing || uid(6);
  const sharedEl = $('#c-shared');
  const rec = {
    title, questions, criteria,
    timeLimit: Math.max(1, +$('#c-time').value||20),
    attemptLimit: Math.max(1, +$('#c-attempts').value||1),
    startAt, endAt,
    shuffleQ: $('#c-shq').value==='1', shuffleO: $('#c-sho').value==='1',
    showMistakes: $('#c-mis').value==='1',
    shared: sharedEl ? sharedEl.value==='1' : (editing ? !!src.shared : false),
    ownerUid:  editing ? (src.ownerUid || currentUser.uid) : currentUser.uid,
    ownerName: editing ? (src.ownerName || '') : (currentUser.displayName || currentUser.email),
    createdAt: editing ? (src.createdAt || Date.now()) : Date.now()
  };
  if(editing){
    // Tahrirlashda tegilmasligi kerak bo'lgan maydonlar saqlanib qoladi
    if(src.closed) rec.closed = true;
    if(src.sourceTestId){ rec.sourceTestId = src.sourceTestId; rec.sourceTitle = src.sourceTitle || ''; }
    rec.updatedAt = Date.now();
    rec.updatedByUid = currentUser.uid;
    rec.updatedByName = (currentProfile && currentProfile.name) || currentUser.email;
  }
  db.ref('tests/'+id).set(rec).then(()=>{
    if(!editing){
      return logEvent('test.create', { testId:id, testTitle:title, note:`${questions.length} savol · ${rec.shared?'umumiy':'shaxsiy'}` });
    }
    const ch = [];
    if((src.title||'') !== title) ch.push(`nomi: "${src.title||''}" → "${title}"`);
    const oldN = (src.questions||[]).length;
    if(oldN !== questions.length) ch.push(`savollar soni: ${oldN} → ${questions.length}`);
    else if(JSON.stringify(src.questions||[]) !== JSON.stringify(questions)) ch.push('savol matnlari o‘zgardi');
    if((src.timeLimit||0) !== rec.timeLimit) ch.push(`vaqt: ${src.timeLimit||0} → ${rec.timeLimit} daqiqa`);
    if((src.attemptLimit||1) !== rec.attemptLimit) ch.push(`urinish: ${src.attemptLimit||1} → ${rec.attemptLimit}`);
    if(!!src.shared !== !!rec.shared) ch.push(rec.shared ? 'umumiyga qo‘shildi' : 'umumiydan chiqarildi');
    if(JSON.stringify(src.criteria||[]) !== JSON.stringify(criteria)) ch.push('baho mezoni o‘zgardi');
    if(!ch.length) ch.push('sozlamalar yangilandi');
    return logEvent('test.edit', { testId:id, testTitle:title, ownerUid:rec.ownerUid, ownerName:rec.ownerName, note: ch.join(' · ') });
  }).then(()=>{
    editingTestId = null; window.__editSrc = null;
    curTestId = id; adminTab='tests'; setTab('tests');
    alert(editing ? "✅ O'zgarishlar saqlandi." : 'Test saqlandi! Havolani "Testlarim" bo‘limidan oling.');
  }).catch(e=> alert("Saqlab bo'lmadi: " + e.message));
}

function logLabel(a){ return LOG_LABELS[a] || a; }

function actorInfo(){
  return {
    actorUid:   currentUser ? currentUser.uid : '—',
    actorName:  (currentProfile && currentProfile.name) || (currentUser && (currentUser.displayName || currentUser.email)) || '—',
    actorEmail: (currentUser && currentUser.email) || '—',
    actorRole:  (currentProfile && currentProfile.role) || 'teacher'
  };
}
/* Jurnalga yozish. Qayd yozilmasa ham asosiy amal to'xtamaydi — shuning uchun xato faqat konsolga chiqadi. */
function logEvent(action, info){
  if(!db || !currentUser) return Promise.resolve();
  const rec = Object.assign({ at: Date.now(), action }, actorInfo(), info || {});
  Object.keys(rec).forEach(k=>{ if(rec[k] === undefined) delete rec[k]; });
  return db.ref('logs').push(rec).catch(e=>{ console.warn('Qayd yozilmadi:', e); });
}
/* Korzinkaga solish. `ownerUid` — narsaning egasi (admin birovnikini o'chirsa ham egasida turadi). */
function trashPut(kind, ownerUid, title, payload, extra){
  const owner = ownerUid || (currentUser && currentUser.uid);
  const rec = Object.assign({
    at: Date.now(), kind, title: title || '',
    ownerUid: owner,
    byUid: currentUser.uid,
    byName: actorInfo().actorName,
    payload: payload || null
  }, extra || {});
  Object.keys(rec).forEach(k=>{ if(rec[k] === undefined) delete rec[k]; });
  return db.ref('trash/'+owner).push(rec);
}

/* ---------- Korzinkani eskirgan yozuvlardan tozalash ---------- */
function purgeOldTrash(){
  const cutoff = Date.now() - TRASH_TTL_DAYS*24*60*60*1000;
  const isAdmin = currentProfile && currentProfile.role === 'admin';
  const ref = isAdmin ? db.ref('trash') : db.ref('trash/'+currentUser.uid);
  ref.once('value').then(snap=>{
    const val = snap.val(); if(!val) return;
    const buckets = isAdmin ? val : { [currentUser.uid]: val };
    const updates = {};
    Object.entries(buckets).forEach(([owner, items])=>{
      Object.entries(items || {}).forEach(([tid, rec])=>{
        if((rec.at || 0) < cutoff) updates['trash/'+owner+'/'+tid] = null;
      });
    });
    if(Object.keys(updates).length) db.ref().update(updates);
  }).catch(e=> console.warn('Korzinkani tozalab bo‘lmadi:', e));
}

}
function loadLogs(){
  db.ref('logs').limitToLast(1000).once('value').then(snap=>{
    const val = snap.val() || {};
    logCache = Object.entries(val).map(([id, r])=> Object.assign({ _id:id }, r))
                     .sort((a,b)=>(b.at||0)-(a.at||0));
    drawLogs();
  }).catch(e=>{
    $('#lg-list').innerHTML = `<div class="note red">Qaydlarni o'qib bo'lmadi: ${esc(e.message)}<br>
      Bu odatda Firebase Database Rules'ga <b>logs</b> bo'limi qo'shilmaganini bildiradi — README'ga qarang.</div>`;
  });
}
function filteredLogs(){
  const q = ($('#lg-q') ? $('#lg-q').value : '').trim().toLowerCase();
  const kind = $('#lg-kind') ? $('#lg-kind').value : '';
  const days = $('#lg-days') ? +$('#lg-days').value : 0;
  const cutoff = days ? Date.now() - days*24*60*60*1000 : 0;
  return logCache.filter(r=>{
    if(cutoff && (r.at||0) < cutoff) return false;
    if(kind && String(r.action||'').split('.')[0] !== kind) return false;
    if(q){
      const hay = [r.actorName, r.actorEmail, r.testTitle, r.studentName, r.targetName, logLabel(r.action), r.note]
                    .filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function logWhat(r){
  const bits = [];
  if(r.testTitle)    bits.push(`Test: <b>${esc(r.testTitle)}</b>`);
  if(r.studentName)  bits.push(`O'quvchi: <b>${esc(r.studentName)}</b>`);
  if(r.targetName && !r.testTitle && !r.studentName) bits.push(`<b>${esc(r.targetName)}</b>`);
  if(r.ownerName && r.ownerUid && r.ownerUid !== r.actorUid) bits.push(`<span class="muted">egasi: ${esc(r.ownerName)}</span>`);
  if(r.note)         bits.push(`<span class="muted">${esc(r.note)}</span>`);
  return bits.join(' · ') || '<span class="muted">—</span>';
}
function drawLogs(){
  const rows = filteredLogs();
  const el = $('#lg-list'); if(!el) return;
  el.innerHTML = !rows.length
    ? `<p class="muted">Bu shartlarga mos qayd topilmadi.</p>`
    : `<p class="muted" style="margin-bottom:10px">${rows.length} ta qayd</p>
       <div class="tbl"><table>
       <tr><th>Vaqt</th><th>Kim</th><th>Amal</th><th>Nima ustida</th></tr>

             <br><span class="muted">${esc(r.actorEmail||'')}</span></td>
         <td style="white-space:nowrap">${esc(logLabel(r.action))}</td>
         <td>${logWhat(r)}</td>
       </tr>`).join('')}</table></div>`;

function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
function csvCell(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }
function downloadLogs(fmt){
  const rows = filteredLogs();
  if(!rows.length) return alert('Yuklab olishga qayd yo‘q.');
  const stamp = new Date().toISOString().slice(0,10);
  if(fmt === 'json'){
    downloadFile(`laoshi-qaydlar-${stamp}.json`, JSON.stringify(rows, null, 2), 'application/json');
  } else {
    const head = ['Vaqt','Kim','Email','Rol','Amal kodi','Amal','Test','O‘quvchi','Nishon','Egasi','Izoh'];
    const body = rows.map(r=>[
      fmtDT(r.at||0), r.actorName, r.actorEmail, r.actorRole,
      r.action, logLabel(r.action).replace(/^\S+\s/,''), r.testTitle, r.studentName, r.targetName, r.ownerName, r.note
    ].map(csvCell).join(','));

let trashCache = [];
function renderTrash(){
  const isAdmin = currentProfile.role === 'admin';
  $('#tabBody').innerHTML = `
    <div class="card">
      <h2>🗑 Korzinka</h2>
      <p class="muted">O'chirilgan testlar, o'quvchi natijalari${isAdmin?", hisoblar va e'lonlar":''} shu yerda saqlanadi va
      tiklanishi mumkin. ${TRASH_TTL_DAYS} kundan eski yozuvlar avtomatik o'chadi.
      ${isAdmin?'':'<br>Siz faqat o‘zingizga tegishli yozuvlarni ko‘rasiz.'}</p>
      <div style="margin-top:12px"><button class="btn-ghost btn-sm" onclick="loadTrash()">↻ Yangilash</button></div>
    </div>
    <div class="card"><div id="tr-list"><p class="muted">Yuklanmoqda…</p></div></div>`;
  loadTrash();
}
function loadTrash(){
  const isAdmin = currentProfile.role === 'admin';
  const ref = isAdmin ? db.ref('trash') : db.ref('trash/'+currentUser.uid);
  ref.once('value').then(snap=>{
    const val = snap.val() || {};
    const buckets = isAdmin ? val : { [currentUser.uid]: val };
    trashCache = [];
    Object.entries(buckets).forEach(([owner, items])=>{
      Object.entries(items || {}).forEach(([tid, rec])=> trashCache.push(Object.assign({_id:tid, _owner:owner}, rec)));
    });
    trashCache.sort((a,b)=>(b.at||0)-(a.at||0));
    drawTrash();
  }).catch(e=>{
    $('#tr-list').innerHTML = `<div class="note red">Korzinkani o'qib bo'lmadi: ${esc(e.message)}<br>
      Firebase Database Rules'ga <b>trash</b> bo'limi qo'shilganini tekshiring — README'ga qarang.</div>`;
  });
}
const TRASH_KIND = { test:'📚 Test', session:'👤 O‘quvchi natijasi', teacher:'👥 Hisob', announce:'📢 E‘lon' };
function drawTrash(){
  const el = $('#tr-list'); if(!el) return;
  el.innerHTML = !trashCache.length
    ? `<div class="empty"><span class="ico">🗑</span>Korzinka bo'sh.</div>`
    : trashCache.map(r=>{
        const days = Math.max(0, TRASH_TTL_DAYS - Math.floor((Date.now()-(r.at||0))/86400000));
        return `<div class="lrow">
          <div class="lrow-main">
            <div class="lrow-title">${esc(r.title || '(nomsiz)')} <span class="pill p-gray">${TRASH_KIND[r.kind]||r.kind}</span></div>
            <div class="lrow-sub">O'chirgan: <b>${esc(r.byName||'—')}</b> ·
              ${fmtDT(r.at||0)} ·
              ${days} kundan keyin butunlay o'chadi</div>
            ${r.note ? `<div class="lrow-sub">${esc(r.note)}</div>` : ''}
          </div>
          <div class="lrow-act">
            <button class="btn-jade btn-sm" onclick="restoreTrash('${r._owner}','${r._id}')">♻️ Tiklash</button>
            ${menuHtml('trm-'+r._id, [{label:'♨️ Butunlay o‘chirish', fn:`purgeTrash('${r._owner}','${r._id}')`, danger:true}])}
          </div>
        </div>`;
      }).join('');
}
function trashRec(owner, id){ return trashCache.find(r=> r._owner===owner && r._id===id); }
function restoreTrash(owner, id){
  const r = trashRec(owner, id); if(!r) return;
  if(!confirm(`"${r.title}" tiklansinmi?`)) return;
  const p = r.payload || {};
  let job, ev;
  if(r.kind === 'test'){
    const updates = { ['tests/'+r.testId]: p.test || null };
    if(p.sessions) updates['sessions/'+r.testId] = p.sessions;
    job = db.ref().update(updates);
    ev = ['test.restore', { testId:r.testId, testTitle:r.title, ownerUid:r.ownerUid, ownerName:(p.test&&p.test.ownerName)||'' }];
  } else if(r.kind === 'session'){
    job = db.ref('sessions/'+r.testId+'/'+r.sessionId).set(p);
    ev = ['session.restore', { testId:r.testId, testTitle:r.testTitle, studentName:r.title }];
  } else if(r.kind === 'teacher'){
    job = db.ref('teachers/'+r.targetUid).set(p);
    ev = ['teacher.restore', { targetId:r.targetUid, targetName:r.title }];
  } else if(r.kind === 'announce'){
    job = db.ref('announcements/'+r.targetId).set(p);
    ev = ['announce.restore', { targetId:r.targetId, targetName:r.title }];
  } else { return alert('Bu turdagi yozuvni tiklab bo‘lmaydi.'); }
  job.then(()=> db.ref('trash/'+owner+'/'+id).remove())
     .then(()=> logEvent(ev[0], ev[1]))
     .then(()=>{ alert('✅ Tiklandi.'); loadTrash(); })
     .catch(e=> alert('Tiklab bo‘lmadi: ' + e.message));
}
function purgeTrash(owner, id){
  const r = trashRec(owner, id); if(!r) return;
  if(!confirm(`"${r.title}" butunlay o'chirilsinmi? Bu amalni orqaga qaytarib bo'lmaydi.`)) return;
  db.ref('trash/'+owner+'/'+id).remove()
    .then(()=> logEvent('trash.purge', { targetName:r.title, note:(TRASH_KIND[r.kind]||r.kind) }))
    .then(()=>{ loadTrash(); })
    .catch(e=> alert('O‘chirib bo‘lmadi: ' + e.message));
}


/* ================= KIRISH TARIXI (qurilma / IP) ================= */
/* Brauzer o'z IP'sini bilmaydi — uni bepul tashqi xizmatdan so'raymiz.
   Xizmat javob bermasa qayd baribir yoziladi, faqat IP bo'sh qoladi. */
const LOGIN_KEEP = 50;   // har bir hisob uchun shuncha oxirgi kirish saqlanadi

function deviceInfo(){
  const ua = navigator.userAgent || '';
  let os = 'Nomaʼlum tizim';
  if(/Windows NT 10/.test(ua))      os = 'Windows 10/11';
  else if(/Windows NT/.test(ua))    os = 'Windows';
  else if(/iPhone/.test(ua))        os = 'iPhone';
  else if(/iPad/.test(ua))          os = 'iPad';
  else if(/Android/.test(ua))       os = 'Android';
  else if(/Mac OS X/.test(ua))      os = 'macOS';
  else if(/Linux/.test(ua))         os = 'Linux';
  let br = 'Nomaʼlum brauzer';
  if(/Edg\//.test(ua))                                      br = 'Edge';
  else if(/OPR\//.test(ua))                                 br = 'Opera';
  else if(/YaBrowser/.test(ua))                             br = 'Yandex';
  else if(/Chrome\//.test(ua) && !/Chromium/.test(ua))      br = 'Chrome';
  else if(/Firefox\//.test(ua))                             br = 'Firefox';
  else if(/Safari\//.test(ua))                              br = 'Safari';
  const m = ua.match(/(?:Edg|OPR|YaBrowser|Chrome|Firefox|Version)\/(\d+)/);
  if(m) br += ' ' + m[1];
  return { os, browser: br, mobile: /Mobi|Android|iPhone|iPad/.test(ua), ua: ua.slice(0,300) };
}
function fetchPublicIP(){
  return new Promise(resolve=>{
    let done = false;
    const finish = v => { if(!done){ done = true; resolve(v || ''); } };
    setTimeout(()=> finish(''), 3500);
    fetch('https://api.ipify.org?format=json', {cache:'no-store'})
      .then(r=> r.ok ? r.json() : null)
      .then(d=> finish(d && d.ip))
      .catch(()=> finish(''));
  });
}
function recordLogin(){
  const d = deviceInfo();
  fetchPublicIP().then(ip=>{
    const rec = { at: Date.now(), ip: ip || '', os: d.os, browser: d.browser, mobile: !!d.mobile, ua: d.ua };
    const parts = [d.os, d.browser]; if(ip) parts.push('IP ' + ip);
    logEvent('auth.login', { note: parts.join(' · '), ip: ip || '', device: d.os + ' · ' + d.browser });
    db.ref('logins/'+currentUser.uid).push(rec)
      .then(()=> trimLogins())
      .catch(e=> console.warn('Kirish qaydi yozilmadi:', e));
  });
}
function trimLogins(){
  db.ref('logins/'+currentUser.uid).once('value').then(snap=>{
    const v = snap.val() || {};
    const keys = Object.keys(v);
    if(keys.length <= LOGIN_KEEP) return;
    const old = keys.map(k=>({k, at:(v[k]||{}).at||0})).sort((a,b)=>a.at-b.at)
                    .slice(0, keys.length - LOGIN_KEEP);
    const upd = {}; old.forEach(o=> upd['logins/'+currentUser.uid+'/'+o.k] = null);
    db.ref().update(upd);
  }).catch(()=>{});
}

/* ================= TUGALLANMAGAN NATIJANI HISOBLASH ================= */
/* Tugatgan o'quvchida bazadagi tayyor natija ishlatiladi; tugatmaganda shu paytgacha
   to'plagani jonli hisoblanadi — bloklangan yoki chiqib ketgan o'quvchi ham ko'rinadi. */
function scoreOf(s, t){
  const qs = (t && t.questions) || [];
  const total = qs.length;
  if(s && s.status === 'finished'){
    return { total, correct: s.correct||0, answered: Object.keys(s.answers||{}).length,
             percent: s.percent||0, grade: s.grade || '—', done: true };
  }
  let correct = 0, answered = 0;
  qs.forEach((q,i)=>{
    const a = (s && s.answers || {})[i];
    if(a != null){ answered++; if(a === q.correct) correct++; }
  });
  const percent = total ? Math.round(correct/total*100) : 0;
  return { total, correct, answered, percent,
           grade: gradeOf(percent, (t && t.criteria) || []), done: false };
}
function scoreCell(s, t){
  const sc = scoreOf(s, t);
  if(sc.done){
    return `<b>${sc.correct}/${sc.total}</b> · ${sc.percent}% · <b>${esc(sc.grade)}</b>` +
           (s.timeout ? ' <span class="muted">(vaqt tugadi)</span>' : '');
  }
  if(!sc.answered) return '<span class="muted">—</span>';
  return `<b>${sc.correct}/${sc.total}</b> · ${sc.percent}% · <b>${esc(sc.grade)}</b>
          <br><span class="muted">tugallanmagan · ${sc.answered} ta javob</span>`;
}

        <td><span class="dot ${si.dot}"></span></td>
        <td style="font-weight:600;cursor:pointer" onclick="showDetail('${sid}')">${esc(s.name)}</td>
        <td><span class="pill ${si.pill}">${si.txt}</span></td>
        <td>${answered}/${total}</td>
        <td>${scoreCell(s, t)}</td>
        <td>${s.violations ? `<span class="pill p-red">${s.violations}×</span>` : '0'}</td>
        <td style="white-space:nowrap">
          ${s.status==='locked' ? `<button class="btn-jade btn-sm" onclick="approve('${sid}')">✓ Ruxsat</button>` : ''}
          <button class="btn-ghost btn-sm" onclick="resetStudent('${sid}')">↺</button>
          <button class="btn-ghost btn-sm" onclick="delSession('${sid}')">🗑</button>
        </td></tr>`;
    }).join('')}</table></div>`;

  // error map
  const wrong = t.questions.map(()=>0); let counted = 0;
  rows.forEach(([,s])=>{
    if(s.status!=='finished') return; counted++;
    t.questions.forEach((q,i)=>{ if((s.answers||{})[i] !== q.correct) wrong[i]++; });
  });
  $('#dash-map').innerHTML = !counted
    ? `<p class="muted">Kamida bitta o'quvchi tugatgach ko'rinadi.</p>`
    : `<table><tr><th>#</th><th>Savol</th><th>Xato qilganlar</th><th></th></tr>` +
      t.questions.map((q,i)=>{
        const pc = Math.round(wrong[i]/counted*100);
        return `<tr><td class="q-num">${i+1}</td><td>${esc(q.q)}</td>
          <td style="white-space:nowrap">${wrong[i]}/${counted} (${pc}%)</td>
          <td><div class="bar"><i style="width:${pc}%;background:${pc>=50?'var(--red)':pc>=25?'var(--amber)':'var(--jade)'}"></i></div></td></tr>`;
      }).join('') + `</table>`;
}
function curTestMeta(){ return dashTestsSource()[curTestId] || {}; }
function approve(sid){
  const s = curSessions[sid] || {}; const t = curTestMeta();
  db.ref(`sessions/${curTestId}/${sid}`).update({status:'approved'})
    .then(()=> logEvent('session.approve', { testId:curTestId, testTitle:t.title, studentName:s.name, ownerUid:t.ownerUid, ownerName:t.ownerName }));
}
function resetStudent(sid){
  if(!confirm("O'quvchi testni boshidan boshlaydi. Davom etilsinmi?")) return;
  const s = curSessions[sid] || {}; const t = curTestMeta();
  db.ref(`sessions/${curTestId}/${sid}`).update({status:'reset', answers:null, violations:0, correct:null, percent:null, grade:null, timeout:null})
    .then(()=> logEvent('session.reset', { testId:curTestId, testTitle:t.title, studentName:s.name, ownerUid:t.ownerUid, ownerName:t.ownerName,
      note: s.status==='finished' ? `oldingi natija: ${s.percent}%` : `oldingi holat: ${s.status||'—'}` }));
}
/* O'quvchi natijasi ham korzinkaga tushadi — xato bosilsa tiklab bo'ladi. */
function delSession(sid){
  const s = curSessions[sid]; if(!s) return;
  const t = curTestMeta();
  if(!confirm(`${s.name} ning natijasi korzinkaga o'tkazilsinmi?`)) return;
  trashPut('session', t.ownerUid, s.name, s, { testId:curTestId, sessionId:sid, testTitle:t.title,
      note: s.status==='finished' ? `${t.title||''} · ${s.percent}%` : (t.title||'') })
    .then(()=> db.ref(`sessions/${curTestId}/${sid}`).remove())
    .then(()=> logEvent('session.delete', { testId:curTestId, testTitle:t.title, studentName:s.name, ownerUid:t.ownerUid, ownerName:t.ownerName }))
    .catch(e=> alert("O'chirib bo'lmadi: " + e.message));
}
function showDetail(sid){
  const t = dashTestsSource()[curTestId], s = curSessions[sid]; if(!t||!s) return;
  $('#modal-slot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)this.remove()">
    <div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="margin:0">${esc(s.name)} — batafsil</h2>
      <button class="btn-ghost btn-sm" onclick="document.querySelector('.modal-bg').remove()">✕</button></div>
    ${t.questions.map((q,i)=>{
      const a = (s.answers||{})[i];
      const ok = a === q.correct;
      return `<div class="q-card" style="border-left:4px solid ${a==null?'#B9BFC6':ok?'var(--jade)':'var(--red)'}">
        <div class="q-text"><span class="q-num">${i+1}.</span>${esc(q.q)}</div>
        <div class="muted">Javobi: <b style="color:${a==null?'inherit':ok?'var(--jade)':'var(--red)'}">${a==null?'javob bermagan':esc(q.options[a])}</b>
        ${!ok?`<br>To'g'risi: <b style="color:var(--jade)">${esc(q.options[q.correct])}</b>`:''}</div></div>`;
    }).join('')}</div></div>`;
}
function exportExcel(){
  const t = dashTestsSource()[curTestId]; if(!t) return;
  const total = t.questions.length;
  const rows = Object.values(curSessions);

  // Imtixon sanasi/vaqtini haqiqiy sessiya faoliyatidan hisoblaymiz; bo'lmasa test sozlamalaridan.
  const starts = rows.map(s=>s.startedAt).filter(Boolean);
  const ends = rows.map(s=>s.finishedAt).filter(Boolean);
  const minStart = starts.length ? Math.min(...starts) : (t.startAt || null);
  const maxEnd = ends.length ? Math.max(...ends) : (t.endAt || null);
  const dateStr = minStart ? fmtD(minStart) : '—';
  const timeFrom = minStart ? fmtHM(minStart) : '—';
  const timeTo = maxEnd ? fmtHM(maxEnd) : '—';

  const statusLabel = s => {
    if(s.status==='finished') return s.timeout ? "Tugatdi (vaqt tugadi)" : "Tugatdi";
    if(s.status==='locked') return "Bloklangan";
    if(s.status==='approved') return "Ruxsat berildi";
    return "Yozmoqda";
  };

  const sorted = rows.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const header = [
    ['Fan / Mavzu:', t.title],
    ['Laoshi:', t.ownerName || ''],
    ['Sana:', dateStr],
    ['Imtixon vaqti:', `${timeFrom} — ${timeTo}`],
    [],
    ['№','Ism','To\u2018g\u2018ri','Jami','Foiz','Baho','Javob berdi','Holat','Chiqishlar']
  ];
  const body = sorted.map((s,i)=>{
    const sc = scoreOf(s, t);
    const shown = sc.done || sc.answered > 0;   // tugatmagan bo'lsa ham to'plagani yoziladi
    return [
      i+1, s.name||'',
      shown ? sc.correct : '',
      shown ? total : '',
      shown ? sc.percent+'%' : '',
      shown ? (sc.grade||'') : '',
      sc.answered,
      statusLabel(s) + (!sc.done && sc.answered ? ' (tugallanmagan)' : ''),
      s.violations||0
    ];
  });

  const ws = XLSX.utils.aoa_to_sheet([...header, ...body]);
  ws['!cols'] = [{wch:4},{wch:24},{wch:8},{wch:8},{wch:8},{wch:16},{wch:12},{wch:24},{wch:11}];
  ws['!merges'] = [
    {s:{r:0,c:1},e:{r:0,c:3}}, {s:{r:1,c:1},e:{r:1,c:3}},
    {s:{r:2,c:1},e:{r:2,c:3}}, {s:{r:3,c:1},e:{r:3,c:3}}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Natijalar');
  XLSX.writeFile(wb, t.title.replace(/[^\w\d]+/g,'_')+'_natijalar.xlsx');
}

/* ================= STUDENT ================= */
let ST = null; // {testId, sid, test, order, deadline, timerInt, sessRef}

function studentEntry(testId){
  db.ref('tests/'+testId).once('value').then(snap=>{
    const test = snap.val();
    if(!test){ app.innerHTML = `<div class="card center narrow" style="margin:40px auto"><h2>Test topilmadi</h2><p class="muted">Havolani laoshidan qayta so'rang.</p></div>`; return; }
    const sid = localStorage.getItem('lt_sid_'+testId);
    if(sid){
      db.ref(`sessions/${testId}/${sid}`).once('value').then(s=>{
        const sess = s.val();
        if(!sess){ localStorage.removeItem('lt_sid_'+testId); return renderJoinGate(testId,test); }
        resumeStudent(testId, sid, test, sess);
      });
    } else renderJoinGate(testId, test);
  });
}
function renderJoinGate(testId, test){
  const now = Date.now();
  if(test.closed) return renderAvailability(test, 'closed');
  if(test.startAt && now < test.startAt) return renderAvailability(test, 'not-started');
  if(test.endAt && now > test.endAt) return renderAvailability(test, 'ended');
  renderJoin(testId, test);
}
function renderAvailability(test, kind){
  const fmt = ts => fmtDT(ts);
  app.innerHTML = `
  <div class="narrow" style="margin:0 auto">
    <div class="brand"><div class="seal">考</div><div><h1>${esc(test.title)}</h1></div></div>
    <div class="card center" style="margin-top:10px">
      <div style="font-size:44px">${kind==='not-started'?'⏳':'🔒'}</div>
      <h2>${kind==='not-started' ? 'Test hali boshlanmagan' : kind==='closed' ? 'Test yakunlangan' : 'Test vaqti tugagan'}</h2>
      <p class="muted">${kind==='not-started'
        ? `Boshlanish vaqti: <b>${fmt(test.startAt)}</b>`
        : kind==='closed'
        ? `Laoshi bu testni yakunlab, yangi urinishlarni to\u2018xtatgan.`
        : `Tugash vaqti: <b>${fmt(test.endAt)}</b> da yakunlangan.`}</p>
    </div>
  </div>`;
}
function renderJoin(testId, test){
  app.innerHTML = `
  <div class="narrow" style="margin:0 auto">
    <div class="brand"><div class="seal">考</div><div><h1>${esc(test.title)}</h1><small>${test.questions.length} savol · ${test.timeLimit} daqiqa</small></div></div>
    <div class="card">
      <div class="note red"><b>⚠️ Muhim qoidalar:</b><br>
      • Test boshlangach vaqt to'xtamaydi.<br>
      • Boshqa oynaga/ilovaga o'tsangiz yoki brauzerdan chiqsangiz — test <b>darhol bloklanadi</b> va faqat laoshi ruxsati bilan davom etasiz.<br>
      • Vaqt tugasa javoblaringiz avtomatik topshiriladi.</div>
      <label>Ism va familiyangiz</label>
      <input id="s-name" placeholder="Masalan: Aziza Karimova" onkeydown="if(event.key==='Enter')startStudent('${testId}')">
      <div style="margin-top:16px"><button class="btn-red" style="width:100%" onclick="startStudent('${testId}')">▶️ Testni boshlash</button></div>
    </div>
  </div>`;
  $('#s-name').focus();
  ST = {testId, test};
}
function startStudent(testId){
  const name = $('#s-name').value.trim();
  if(name.length < 3) return alert('Ism-familiyangizni to\u2018liq kiriting');
  const sid = uid(8);
  localStorage.setItem('lt_sid_'+testId, sid);
  const t = ST.test;
  const order = t.shuffleQ ? shuffle(t.questions.map((_,i)=>i)) : t.questions.map((_,i)=>i);
  const optOrders = t.questions.map(q => t.shuffleO ? shuffle(q.options.map((_,j)=>j)) : q.options.map((_,j)=>j));
  const deadline = Date.now() + t.timeLimit*60000;
  db.ref(`sessions/${testId}/${sid}`).set({
    name, status:'active', startedAt:Date.now(), deadline, violations:0, attempts:1,
    order, optOrders
  }).then(()=> runTest(testId, sid, t, {name, order, optOrders, deadline, answers:{}, attempts:1}));
}
function resumeStudent(testId, sid, test, sess){
  if(sess.status === 'finished'){ ST = {testId, sid, test}; return renderResult(test, sess); }
  if(sess.status === 'locked')   return renderLocked(testId, sid, test);
  if(sess.status === 'reset'){
    localStorage.removeItem('lt_sid_'+testId);
    return renderJoinGate(testId, test);
  }
  if(sess.status === 'approved'){
    // continue: new deadline from remaining
    const deadline = Date.now() + (sess.remainingSec||60)*1000;
    db.ref(`sessions/${testId}/${sid}`).update({status:'active', deadline});
    sess.deadline = deadline; sess.status='active';
  }
  runTest(testId, sid, test, sess);
}

function runTest(testId, sid, test, sess){
  ST = {testId, sid, test, deadline: sess.deadline,
        order: sess.order || test.questions.map((_,i)=>i),
        optOrders: sess.optOrders || test.questions.map(q=>q.options.map((_,j)=>j)),
        answers: sess.answers || {}, attempts: sess.attempts || 1, active:true};
  ST.sessRef = db.ref(`sessions/${testId}/${sid}`);

  // watch for teacher reset while writing
  ST.sessRef.child('status').on('value', s=>{
    const st = s.val();
    if(st==='reset'){ location.reload(); }
    if(st==='locked' && ST.active){ ST.active=false; renderLocked(testId,sid,test); }
  });

  app.innerHTML = `
  <div class="narrow noselect" style="margin:0 auto" oncontextmenu="return false">
    <div class="timerbar" id="tbar">
      <div><b style="font-size:14px;letter-spacing:0">${esc(sess.name||'')}</b><br><span style="font-size:12px;opacity:.75">${esc(test.title)}</span></div>
      <b id="tleft">--:--</b>
    </div>
    <div id="qs"></div>
    <div class="card center">
      <p class="muted" id="progress-note"></p>
      <button class="btn-red" style="width:100%;margin-top:8px" onclick="submitTest(false)">📤 Testni topshirish</button>
    </div>
  </div>`;

  $('#qs').innerHTML = ST.order.map((qi, pos)=>{
    const q = test.questions[qi];
    return `<div class="q-card">
      <div class="q-text"><span class="q-num">${pos+1}.</span>${esc(q.q)}</div>
      ${ST.optOrders[qi].map((oj, li)=>`
        <label class="opt ${ST.answers[qi]===oj?'sel':''}" data-q="${qi}" data-o="${oj}">
          <input type="radio" name="q${qi}" ${ST.answers[qi]===oj?'checked':''} onchange="pick(${qi},${oj},this)">
          <span><b>${LETTERS[li]}.</b> ${esc(q.options[oj])}</span>
        </label>`).join('')}
    </div>`;
  }).join('');
  updProgress();

  // timer
  ST.timerInt = setInterval(()=>{
    const left = (ST.deadline - Date.now())/1000;
    const el = $('#tleft'); if(!el){ clearInterval(ST.timerInt); return; }
    el.textContent = fmtT(left);
    $('#tbar').classList.toggle('warn', left<120 && left>=30);
    $('#tbar').classList.toggle('crit', left<30);
    if(left <= 0){ clearInterval(ST.timerInt); submitTest(true); }
  }, 500);

  // anti-cheat
  ST.onHide = ()=>{ if(document.hidden) lockNow('Sahifadan chiqib ketdi'); };
  ST.onBlur = ()=> lockNow('Boshqa oynaga o\u2018tdi');
  document.addEventListener('visibilitychange', ST.onHide);
  window.addEventListener('blur', ST.onBlur);

  // tasodifan chiqib ketishdan ogohlantirish (yopish/yangilash urinishida)
  ST.onBeforeUnload = e => { e.preventDefault(); e.returnValue = ''; };
  window.addEventListener('beforeunload', ST.onBeforeUnload);
}
function pick(qi, oj, input){
  ST.answers[qi] = oj;
  document.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(el=>el.classList.toggle('sel', +el.dataset.o===oj));
  ST.sessRef.child('answers/'+qi).set(oj);
  updProgress();
}
function updProgress(){
  const n = Object.keys(ST.answers).length, t = ST.test.questions.length;
  const el = $('#progress-note'); if(el) el.textContent = `${n}/${t} savolga javob berildi`;
}
function detachStudent(){
  if(!ST) return;
  ST.active = false;
  clearInterval(ST.timerInt);
  document.removeEventListener('visibilitychange', ST.onHide||(()=>{}));
  window.removeEventListener('blur', ST.onBlur||(()=>{}));
  window.removeEventListener('beforeunload', ST.onBeforeUnload||(()=>{}));
  if(ST.sessRef) ST.sessRef.child('status').off();
}
function lockNow(reason){
  if(!ST || !ST.active) return;
  const remainingSec = Math.max(0, Math.round((ST.deadline - Date.now())/1000));
  ST.sessRef.update({status:'locked', remainingSec,
    violations: firebase.database.ServerValue.increment(1), lockReason: reason});
  detachStudent();
  renderLocked(ST.testId, ST.sid, ST.test);
}
function renderLocked(testId, sid, test){
  detachStudent();
  app.innerHTML = `
  <div class="narrow" style="margin:0 auto">
    <div class="card center" style="margin-top:40px">
      <div style="font-size:52px">🔒</div>
      <h2>Test bloklandi</h2>
      <p class="muted">Siz test oynasidan chiqib ketdingiz. Qoidaga ko'ra test to'xtatildi.<br>
      Davom etish uchun <b>laoshi ruxsatini kuting</b> — ruxsat berilishi bilan bu sahifa o'zi yangilanadi.</p>
      <p class="muted" style="margin-top:10px">Sahifani yopmang.</p>
    </div>
  </div>`;
  db.ref(`sessions/${testId}/${sid}/status`).on('value', s=>{
    const st = s.val();
    if(st==='approved' || st==='reset'){ db.ref(`sessions/${testId}/${sid}/status`).off(); location.reload(); }
  });
}
function submitTest(timeout){
  if(!ST || !ST.active) return;
  if(!timeout){
    const n = Object.keys(ST.answers).length, t = ST.test.questions.length;
    if(n < t && !confirm(`Siz ${t-n} ta savolga javob bermadingiz. Baribir topshirasizmi?`)) return;
  }
  const test = ST.test;
  let correct = 0;
  test.questions.forEach((q,i)=>{ if(ST.answers[i]===q.correct) correct++; });
  const percent = Math.round(correct/test.questions.length*100);
  const grade = gradeOf(percent, test.criteria);
  const result = {status:'finished', correct, percent, grade, timeout:!!timeout, finishedAt:Date.now()};
  ST.sessRef.update(result);
  const attempts = ST.attempts;
  detachStudent();
  renderResult(test, {...result, answers:ST.answers, attempts, name:''});
}
function studentRetry(){
  if(!ST) return;
  const testId = ST.testId, sid = ST.sid;
  Promise.all([
    db.ref(`sessions/${testId}/${sid}`).once('value'),
    db.ref(`tests/${testId}`).once('value')
  ]).then(([s, tSnap])=>{
    const sess = s.val();
    const test = tSnap.val() || ST.test;
    if(test.closed){ alert("Laoshi bu testni yakunlagan, qayta urinib bo'lmaydi."); return; }
    const limit = test.attemptLimit || 1;
    const used = sess.attempts || 1;
    if(used >= limit){ alert("Urinishlar soni tugadi. Qayta boshlash uchun laoshidan so'rang."); return; }
    const now = Date.now();
    if(test.endAt && now > test.endAt){ alert("Test vaqti tugagan, qayta urinib bo'lmaydi."); return; }
    const order = test.shuffleQ ? shuffle(test.questions.map((_,i)=>i)) : test.questions.map((_,i)=>i);
    const optOrders = test.questions.map(q => test.shuffleO ? shuffle(q.options.map((_,j)=>j)) : q.options.map((_,j)=>j));
    const deadline = now + test.timeLimit*60000;
    const attempts = used + 1;
    db.ref(`sessions/${testId}/${sid}`).update({
      status:'active', answers:null, deadline, order, optOrders,
      attempts, correct:null, percent:null, grade:null, timeout:null
    }).then(()=> runTest(testId, sid, test, {name: sess.name, order, optOrders, deadline, answers:{}, attempts}));
  });
}
function renderResult(test, sess){
  const attempts = sess.attempts || 1;
  const canRetry = attempts < (test.attemptLimit || 1) && !(test.endAt && Date.now() > test.endAt);
  app.innerHTML = `
  <div class="narrow" style="margin:0 auto">
    <div class="card center" style="margin-top:30px">
      <h2>Test yakunlandi ${sess.timeout?'⏰ (vaqt tugadi)':''}</h2>
      <div class="stamp ${sess.percent>=71?'pass':''}"><b>${sess.percent}%</b><span>${sess.correct}/${test.questions.length}</span></div>
      <h1 style="font-size:22px">Baho: ${esc(sess.grade)}</h1>
      <p class="muted" style="margin-top:8px">Natijangiz laoshiga yuborildi.</p>
      ${canRetry ? `<button class="btn-jade" style="width:100%;margin-top:14px" onclick="studentRetry()">🔄 Qayta urinib ko'rish (${(test.attemptLimit-attempts)} ta imkoniyat qoldi)</button>` : ''}
    </div>
    ${test.showMistakes && sess.answers ? `<div class="card"><h2>Sizning javoblaringiz</h2>` +
      test.questions.map((q,i)=>{
        const a = (sess.answers||{})[i]; const ok = a===q.correct;
        return `<div class="q-card" style="border-left:4px solid ${a==null?'#B9BFC6':ok?'var(--jade)':'var(--red)'}">
          <div class="q-text"><span class="q-num">${i+1}.</span>${esc(q.q)}</div>
          <div class="muted">Sizniki: <b style="color:${a==null?'inherit':ok?'var(--jade)':'var(--red)'}">${a==null?'—':esc(q.options[a])}</b>
          ${!ok?`<br>To'g'risi: <b style="color:var(--jade)">${esc(q.options[q.correct])}</b>`:''}</div></div>`;
      }).join('') + `</div>` : ''}
  </div>`;
}
